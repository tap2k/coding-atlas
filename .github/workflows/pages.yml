# Publishes the committed static site (site/out) to GitHub Pages on every push to main.
# This is the only automation in the repo; it deploys files already built and committed
# locally. Nothing here runs an agent or a checker.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/out/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
      - id: deployment
        uses: actions/deploy-pages@v4
